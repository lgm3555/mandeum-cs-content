<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">두 번째 조회에도 같은 값일까요?</title><desc id="desc">PostgreSQL · 같은 트랜잭션 A의 일반 SELECT · A 자신의 변경 없음. 핵심  /  Read Committed는 명령별, Repeatable Read는 같은 스냅샷입니다.</desc>
