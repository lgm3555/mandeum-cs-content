<text x="64" y="124" fill="#172b35" font-size="44" font-weight="700" text-anchor="start">두 번째 조회에도 같은 값일까요?</text>
<text x="64" y="172" fill="#5c7079" font-size="24" font-weight="400" text-anchor="start">PostgreSQL · 같은 트랜잭션 A의 일반 SELECT · A 자신의 변경 없음</text>
