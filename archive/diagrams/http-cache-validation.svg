<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">304: 본문은 그대로, 유효한지만 확인</title><desc id="desc">저장된 응답이 오래되어 재검증이 필요한 상황입니다.. 핵심  /  304는 통신을 생략하는 것이 아니라 본문 재전송을 줄입니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="900" fill="#f4f7f7"/>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif">
<text x="64" y="53" fill="#087f73" font-size="19" font-weight="700" text-anchor="start">만듦 / DAILY CS</text>
<text x="1336" y="53" fill="#5c7079" font-size="19" font-weight="400" text-anchor="end">06 / 네트워크</text>
<text x="64" y="124" fill="#172b35" font-size="44" font-weight="700" text-anchor="start">304: 본문은 그대로, 유효한지만 확인</text>
<text x="64" y="172" fill="#5c7079" font-size="24" font-weight="400" text-anchor="start">저장된 응답이 오래되어 재검증이 필요한 상황입니다.</text>
<rect x="44" y="210" width="1312" height="515" rx="24" fill="#ffffff" stroke="#e0e9e8" stroke-width="2"/>
<rect x="44" y="754" width="1312" height="90" rx="18" fill="#e2f0eb" stroke="none" stroke-width="2"/>
<text x="74" y="808" fill="#087f73" font-size="25" font-weight="700" text-anchor="start">핵심  /  304는 통신을 생략하는 것이 아니라 본문 재전송을 줄입니다.</text>
<text x="64" y="876" fill="#5c7079" font-size="16" font-weight="400" text-anchor="start">MANDEUM  ·  직접 제작한 학습용 개념도</text>
<text x="1336" y="876" fill="#5c7079" font-size="16" font-weight="400" text-anchor="end">세부 조건과 참고 문서는 본문에서 확인하세요.</text>
<rect x="100" y="250" width="390" height="145" rx="14" fill="#eff5f5" stroke="#d4e2e0" stroke-width="2"/>
<text x="124" y="292" fill="#087f73" font-size="27" font-weight="700" text-anchor="start">브라우저 캐시</text>
<text x="124" y="332" fill="#5c7079" font-size="23" font-weight="400" text-anchor="start">저장한 본문</text>
<text x="124" y="369" fill="#5c7079" font-size="23" font-weight="400" text-anchor="start">ETag: &quot;v1&quot;</text>
<rect x="910" y="250" width="390" height="145" rx="14" fill="#edf2fc" stroke="#d4e2e0" stroke-width="2"/>
<text x="934" y="292" fill="#3566b8" font-size="27" font-weight="700" text-anchor="start">서버</text>
<text x="934" y="332" fill="#5c7079" font-size="23" font-weight="400" text-anchor="start">현재 표현의 ETag</text>
<text x="934" y="369" fill="#5c7079" font-size="23" font-weight="400" text-anchor="start">&quot;v1&quot; → 변경 없음</text>
<text x="700" y="451" fill="#087f73" font-size="25" font-weight="700" text-anchor="middle">If-None-Match: &quot;v1&quot;</text>
<line x1="303" y1="474" x2="1097" y2="474" stroke="#087f73" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="700" y="548" fill="#3566b8" font-size="25" font-weight="700" text-anchor="middle">304 Not Modified  ·  응답 본문 없음</text>
<line x1="1097" y1="568" x2="303" y2="568" stroke="#3566b8" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="100" y="618" width="1200" height="62" rx="14" fill="#e6f3ef" stroke="#d4e2e0" stroke-width="2"/>
<text x="700" y="658" fill="#087f73" font-size="27" font-weight="700" text-anchor="middle">브라우저는 저장한 본문을 재사용합니다.</text>
</g></svg>
