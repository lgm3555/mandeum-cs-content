<title id="title">두 번 증가했는데, 결과는 1?</title><desc id="desc">동기화되지 않은 읽기 → 계산 → 쓰기가 겹치는 실행 순서입니다.. 핵심  /  읽기부터 쓰기까지 보호하거나 원자적 증가를 사용합니다.</desc>
