<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">서로 기다리면 멈추는 교착 상태</title><desc id="desc">이미 가진 락을 놓지 않고 상대의 락을 기다리는 상황입니다.. 핵심  /  모든 경로가 X → Y 순서로 락을 얻도록 통일합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="900" fill="#f4f7f7"/>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif">
<text x="64" y="53" fill="#087f73" font-size="19" font-weight="700" text-anchor="start">만듦 / DAILY CS</text>
<text x="1336" y="53" fill="#5c7079" font-size="19" font-weight="400" text-anchor="end">03 / 운영체제</text>
<text x="64" y="124" fill="#172b35" font-size="44" font-weight="700" text-anchor="start">서로 기다리면 멈추는 교착 상태</text>
<text x="64" y="172" fill="#5c7079" font-size="24" font-weight="400" text-anchor="start">이미 가진 락을 놓지 않고 상대의 락을 기다리는 상황입니다.</text>
<rect x="44" y="210" width="1312" height="515" rx="24" fill="#ffffff" stroke="#e0e9e8" stroke-width="2"/>
<rect x="44" y="754" width="1312" height="90" rx="18" fill="#e2f0eb" stroke="none" stroke-width="2"/>
<text x="74" y="808" fill="#087f73" font-size="25" font-weight="700" text-anchor="start">핵심  /  모든 경로가 X → Y 순서로 락을 얻도록 통일합니다.</text>
<text x="64" y="876" fill="#5c7079" font-size="16" font-weight="400" text-anchor="start">MANDEUM  ·  직접 제작한 학습용 개념도</text>
<text x="1336" y="876" fill="#5c7079" font-size="16" font-weight="400" text-anchor="end">세부 조건과 참고 문서는 본문에서 확인하세요.</text>
<rect x="135" y="365" width="360" height="178" rx="14" fill="#e9f4ef" stroke="#d4e2e0" stroke-width="2"/>
<text x="159" y="407" fill="#087f73" font-size="27" font-weight="700" text-anchor="start">스레드 A</text>
<text x="159" y="447" fill="#5c7079" font-size="23" font-weight="400" text-anchor="start">보유: 락 X</text>
<text x="159" y="484" fill="#5c7079" font-size="23" font-weight="400" text-anchor="start">필요: 락 Y</text>
<rect x="905" y="365" width="360" height="178" rx="14" fill="#edf2fc" stroke="#d4e2e0" stroke-width="2"/>
<text x="929" y="407" fill="#3566b8" font-size="27" font-weight="700" text-anchor="start">스레드 B</text>
<text x="929" y="447" fill="#5c7079" font-size="23" font-weight="400" text-anchor="start">보유: 락 Y</text>
<text x="929" y="484" fill="#5c7079" font-size="23" font-weight="400" text-anchor="start">필요: 락 X</text>
<line x1="470" y1="310" x2="930" y2="310" stroke="#bd5340" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="700" y="286" fill="#bd5340" font-size="25" font-weight="400" text-anchor="middle">A는 B가 가진 Y를 기다림</text>
<line x1="470" y1="310" x2="470" y2="362" stroke="#bd5340" stroke-width="2" />
<line x1="930" y1="310" x2="930" y2="362" stroke="#bd5340" stroke-width="2" />
<line x1="930" y1="592" x2="470" y2="592" stroke="#bd5340" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="700" y="634" fill="#bd5340" font-size="25" font-weight="400" text-anchor="middle">B는 A가 가진 X를 기다림</text>
<line x1="470" y1="546" x2="470" y2="592" stroke="#bd5340" stroke-width="2" />
<line x1="930" y1="546" x2="930" y2="592" stroke="#bd5340" stroke-width="2" />
<text x="700" y="451" fill="#bd5340" font-size="32" font-weight="700" text-anchor="middle">순환 대기</text>
<text x="700" y="490" fill="#5c7079" font-size="23" font-weight="400" text-anchor="middle">진행 불가</text>
</g></svg>
