<text x="117" y="511" fill="#3566b8" font-size="27" font-weight="700" text-anchor="start">키 9 → 나머지 1</text>
<rect x="530" y="260" width="210" height="79" rx="14" fill="#f1f5f5" stroke="#d4e2e0" stroke-width="2"/>
<text x="635" y="310" fill="#5c7079" font-size="27" font-weight="400" text-anchor="middle">버킷 0</text>
