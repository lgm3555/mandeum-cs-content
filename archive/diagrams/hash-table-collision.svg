<text x="849" y="440" fill="#5c7079" font-size="23" font-weight="400" text-anchor="start">값 A</text>
<line x1="1038" y1="410" x2="1102" y2="410" stroke="#087f73" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="1110" y="358" width="205" height="106" rx="14" fill="#edf2fc" stroke="#d4e2e0" stroke-width="2"/>
<text x="1134" y="400" fill="#3566b8" font-size="27" font-weight="700" text-anchor="start">키 9</text>
<text x="1134" y="440" fill="#5c7079" font-size="23" font-weight="400" text-anchor="start">값 B</text>
<text x="825" y="556" fill="#5c7079" font-size="24" font-weight="400" text-anchor="start">조회할 키가 9라면?</text>
<text x="825" y="598" fill="#5c7079" font-size="24" font-weight="400" text-anchor="start">키 5와 다름 → 다음 항목</text>
<text x="825" y="640" fill="#5c7079" font-size="24" font-weight="400" text-anchor="start">키 9와 같음 → 값 B 반환</text>
</g></svg>
