<rect x="530" y="462" width="210" height="79" rx="14" fill="#f1f5f5" stroke="#d4e2e0" stroke-width="2"/>
<text x="635" y="512" fill="#5c7079" font-size="27" font-weight="400" text-anchor="middle">버킷 2</text>
<rect x="530" y="563" width="210" height="79" rx="14" fill="#f1f5f5" stroke="#d4e2e0" stroke-width="2"/>
<text x="635" y="613" fill="#5c7079" font-size="27" font-weight="400" text-anchor="middle">버킷 3</text>
